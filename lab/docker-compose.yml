# Isolated IDPS lab. attacker -> sensor (router, inline) -> victim/dvwa.
# Run attacks only against these containers.
#
# Isolation (see lab/README.md):
# - The networks are not "internal", because Docker drops packets on internal
#   networks whose destination is outside the subnet, which stops the sensor
#   routing. Instead no container has a default route.
# - attacker, victim and dvwa have no NET_ADMIN. Each shares the network
#   namespace of a small "*-net" container that sets its routes and firewall
#   rules (no Docker DNS, no gateway access) and then idles, so nothing inside
#   an endpoint can undo them.
# - The sensor forwards only between the two lab subnets (sensor/nftables.conf).
# - The lab SOC sits on a third network, mgmt_net, shared only with the sensor
#   (lab_mgmt). The sensor never forwards to or from it (rules bound to interfaces,
#   strict reverse-path filtering), so attacker and victim can't reach the SOC.
#   The SOC has no default route, accepts only TCP 8443 and opens no connections
#   (soc/netguard.sh); its port is published on 127.0.0.1 only, for the dashboard.
# - Every setup step fails closed: endpoints start only once their *-net
#   container reports healthy.
name: idps-lab

networks:
  attack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
  victim_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24

volumes:
  soc_data: {}     # SOC only: database, JWT secret, TLS keys
  soc_shared: {}   # ca.pem and the sensor token; read-only in the sensor

services:
  sensor:
    # The repo is copied into the image rather than bind-mounted, because macOS
    # blocks Docker from mounting folders under ~/Desktop. Rebuild after code
    # changes: docker compose up -d --build sensor
    build:
      context: ..
      dockerfile: lab/sensor/Dockerfile
    container_name: idps-sensor
    hostname: sensor
    init: true   # reap exited children (start.sh ends in `sleep infinity`, which doesn't)
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      # Drop packets whose source address doesn't belong behind the interface they came in on.
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks:
      attack_net:
        ipv4_address: 10.10.1.2
      victim_net:
        ipv4_address: 10.10.2.2
      mgmt_net:
        ipv4_address: 10.10.3.2
    volumes:
      - soc_shared:/run/idps-soc:ro

  soc-net:
    # Holds the SOC's network namespace: no default route, inbound TCP 8443 only, outbound
    # replies only (soc/netguard.sh). The SOC itself has no capabilities to change that.
    build:
      context: .
      dockerfile: soc/Dockerfile.net
    container_name: idps-soc-net
    hostname: soc
    cap_add: [NET_ADMIN]
    ports:
      - "127.0.0.1:8443:8443"   # the dashboard, from this machine only
    networks:
      mgmt_net:
        ipv4_address: 10.10.3.10

  soc:
    # Same image as the sensor (it already holds idps/ and soc/), different command. Rebuild
    # both after code changes: docker compose up -d --build sensor soc
    build:
      context: ..
      dockerfile: lab/sensor/Dockerfile
    container_name: idps-soc
    command: ["/opt/idps/lab/soc/start.sh"]
    network_mode: service:soc-net
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LAB_SOC_ADMIN_PASSWORD: ${LAB_SOC_ADMIN_PASSWORD:-}
      # Analysts can't confirm a block of these (the lab gateways, sensor, victims, SOC).
      IDPS_SOC_BLOCK_ALLOWLIST: 10.10.1.1,10.10.1.2,10.10.2.0/24,10.10.3.0/24
      # Made-up, clearly labelled map locations for the lab's private addresses.
      IDPS_SOC_GEO_DEMO: ${LAB_SOC_GEO_DEMO:-false}
      # Real locations for public addresses: the MaxMind GeoLite2 City file, copied into the
      # SOC's volume (it can't be mounted from ~/Desktop and must not go in the image or git).
      IDPS_SOC_GEOIP_DB: ${LAB_SOC_GEOIP_DB:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/health', context=ssl.create_default_context(cafile='/run/idps-soc/ca.pem'), timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - soc_data:/var/lib/idps-soc
      - soc_shared:/run/idps-soc
    depends_on:
      soc-net: {condition: service_healthy}

  attacker-net:
    build: ./netns
    container_name: idps-attacker-net
    hostname: attacker
    cap_add: [NET_ADMIN]
    environment:
      PEER_NET: 10.10.2.0/24
      SENSOR_IP: 10.10.1.2
      GATEWAY_IP: 10.10.1.1
    networks:
      attack_net:
        ipv4_address: 10.10.1.10
    depends_on:
      sensor: {condition: service_healthy}

  attacker:
    # Attack scripts are copied in at build time (no bind mount; see sensor).
    build:
      context: .
      dockerfile: attacker/Dockerfile
    container_name: idps-attacker
    network_mode: service:attacker-net
    depends_on:
      attacker-net: {condition: service_healthy}

  victim-net:
    build: ./netns
    container_name: idps-victim-net
    hostname: victim
    cap_add: [NET_ADMIN]
    environment:
      PEER_NET: 10.10.1.0/24
      SENSOR_IP: 10.10.2.2
      GATEWAY_IP: 10.10.2.1
    networks:
      victim_net:
        ipv4_address: 10.10.2.10
    depends_on:
      sensor: {condition: service_healthy}

  victim:
    build: ./victim
    container_name: idps-victim
    network_mode: service:victim-net
    environment:
      # Checked by the victim's entrypoint, so `docker compose down` still works without .env.
      # Note: anyone with Docker access can read it with `docker inspect`; it is lab-only.
      LAB_VICTIM_PASSWORD: ${LAB_VICTIM_PASSWORD:-}
    depends_on:
      victim-net: {condition: service_healthy}

  dvwa-net:
    build: ./netns
    container_name: idps-dvwa-net
    hostname: dvwa
    cap_add: [NET_ADMIN]
    environment:
      PEER_NET: 10.10.1.0/24
      SENSOR_IP: 10.10.2.2
      GATEWAY_IP: 10.10.2.1
    networks:
      victim_net:
        ipv4_address: 10.10.2.11
    depends_on:
      sensor: {condition: service_healthy}

  dvwa:
    # Pinned by digest so the target web app never changes between experiments.
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    # The image is only published for amd64; on Apple Silicon it runs under emulation.
    platform: linux/amd64
    container_name: idps-dvwa
    network_mode: service:dvwa-net
    depends_on:
      dvwa-net: {condition: service_healthy}
