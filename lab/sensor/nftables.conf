# Lab firewall on the sensor: forward only between the two lab subnets.
# The IDPS adds its own block rules in a separate table later.
table inet labfw {
  chain forward {
    type filter hook forward priority 0; policy drop;
    ip daddr { 10.10.1.1, 10.10.2.1 } drop comment "never forward to the Docker VM gateways"
    ip saddr 10.10.1.0/24 ip daddr 10.10.2.0/24 accept
    ip saddr 10.10.2.0/24 ip daddr 10.10.1.0/24 accept
  }
}
