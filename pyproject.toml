[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idps"
version = "0.1.0"
description = "Network IDPS with explainable AI and a SOC dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "nfstream",
    "scikit-learn",
    "joblib",
    "xgboost",
    "shap",
    "lime",
    "scapy",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn needs it to serve the /ws/alerts live feed
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
]

[project.optional-dependencies]
capture = ["nfstream"]  # already a core dependency; kept so ".[capture]" still works
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
include = ["idps*", "soc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
